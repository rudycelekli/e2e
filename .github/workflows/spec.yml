name: E2E1048 download deadline owner actual module oracle
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant:
        - baseline
        - candidate
    env:
      VARIANT: ${{ matrix.variant }}
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 861fd962f07c5cc638e1a4df78b77d2701ce990d
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.0
    - name: Freeze original source and materialize exact variant
      run: "python - <<'PREP'\nfrom pathlib import Path\nimport subprocess,json,hashlib,base64,os\n\
        assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='861fd962f07c5cc638e1a4df78b77d2701ce990d'\n\
        files=subprocess.check_output(['git','ls-files','-z']).decode().split('\\\
        0')[:-1];identity={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for\
        \ f in files if Path(f).is_file()}\nPath('/tmp/base-identity.json').write_text(json.dumps(identity))\n\
        p=base64.b64decode('');assert\
        \ hashlib.sha256(p).hexdigest()=='d565cc2da3cf7e9fac9bc661ed6832da959d471bc718be607c5740bf125d5aef'\n\
        Path('/tmp/candidate.patch').write_bytes(p)\nif os.environ['VARIANT']=='candidate':\n\
        \ subprocess.run(['git','apply','/tmp/candidate.patch'],check=True)\n identity.update({'packages/web/src/browser.ts':\
        \ '0d44fe6225b78cb023b4b4ea05c0abe9f41cc8ea54bfaef33c0626e4fcec7cab', 'packages/web/src/downloads.ts':\
        \ '219117a91a9c87f4c2091a3d71e5d931f7ad8d5690dadc66ee9c1431f027ab67'})\nPath('/tmp/expected-source.json').write_text(json.dumps(identity))\n\
        Path('/tmp/deadline-oracle.mjs').write_bytes(base64.b64decode(''))\n\
        PREP"
    - name: Locked dependencies
      run: pnpm install --frozen-lockfile > /tmp/install.log 2>&1
    - name: Build actual production modules
      run: pnpm build > /tmp/build.log 2>&1
    - name: Independent actual-recorder/collector controlled clock oracle
      run: "set +e\nnode --test /tmp/deadline-oracle.mjs > /tmp/oracle.log 2>&1\n\
        code=$?\nset -e\nexport ORACLE_EXIT=\"$code\"\npython - <<'EVAL'\nfrom pathlib\
        \ import Path\nimport json,os\nr=json.loads(Path('/tmp/deadline-oracle-results.json').read_text());assert\
        \ len(r)==17,(len(r),r)\nf=[x for x in r if not x['pass']];p=[x for x in r\
        \ if x['pass']]\nif os.environ['VARIANT']=='candidate':assert not f and os.environ['ORACLE_EXIT']=='0',f\n\
        else:\n assert os.environ['ORACLE_EXIT']=='1' and len(p)>=8\n assert any(x['name']=='started\
        \ download is canceled while trigger never settles' for x in f)\n assert any(x['name']=='late\
        \ trigger completion cannot save or attach after owner deadline' for x in\
        \ f)\nPath('/tmp/oracle-evaluation.json').write_text(json.dumps({'variant':os.environ['VARIANT'],'passed':len(p),'failed':len(f),'exit':os.environ['ORACLE_EXIT']},indent=2))\n\
        EVAL"
    - name: Final exact source guards
      if: always()
      run: 'python - <<''GUARD''

        from pathlib import Path

        import json,hashlib

        p=json.loads(Path(''/tmp/expected-source.json'').read_text());assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h
        for f,h in p.items())

        Path(''/tmp/source-guard.json'').write_text(json.dumps({''exact_variant_bytes'':True}))

        GUARD'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: download-owner-${{ matrix.variant }}
        path: '/tmp/install.log

          /tmp/build.log

          /tmp/candidate.patch

          /tmp/expected-source.json

          /tmp/deadline-oracle.mjs

          /tmp/oracle.log

          /tmp/deadline-oracle-results.json

          /tmp/oracle-evaluation.json

          /tmp/source-guard.json'
        if-no-files-found: error
