name: E2E1048 native download deadline repair
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant:
        - baseline
        - candidate
    env:
      VARIANT: ${{ matrix.variant }}
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 861fd962f07c5cc638e1a4df78b77d2701ce990d
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.0
    - name: Freeze original source and materialize exact variant
      run: "python - <<'PREP'\nfrom pathlib import Path\nimport subprocess,json,hashlib,base64,os\n\
        assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='861fd962f07c5cc638e1a4df78b77d2701ce990d'\n\
        files=subprocess.check_output(['git','ls-files','-z']).decode().split('\\\
        0')[:-1];identity={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for\
        \ f in files if Path(f).is_file()}\nPath('/tmp/base-identity.json').write_text(json.dumps(identity))\n\
        p=base64.b64decode('');assert\
        \ hashlib.sha256(p).hexdigest()=='e789ae1366cff7146518e3f30276307a73f44f119b587a046000d063b8f1f1d5'\n\
        Path('/tmp/candidate.patch').write_bytes(p)\nif os.environ['VARIANT']=='candidate':\n\
        \ subprocess.run(['git','apply','/tmp/candidate.patch'],check=True)\n identity.update({'packages/web/src/browser.ts':\
        \ '0d44fe6225b78cb023b4b4ea05c0abe9f41cc8ea54bfaef33c0626e4fcec7cab', 'packages/web/src/downloads.ts':\
        \ '219117a91a9c87f4c2091a3d71e5d931f7ad8d5690dadc66ee9c1431f027ab67', 'packages/web/tests/integration/routes.test.ts':\
        \ '4450f5d4fce8c492d20000c7704dc3f074fd74e8a47678d3df9bb334e6a3d2b3'})\nelse:\n\
        \ Path('packages/web/tests/integration/routes.test.ts').write_bytes(base64.b64decode(''))\n\
        \ identity['packages/web/tests/integration/routes.test.ts']='4450f5d4fce8c492d20000c7704dc3f074fd74e8a47678d3df9bb334e6a3d2b3'\n\
        Path('/tmp/expected-source.json').write_text(json.dumps(identity))\nPath('/tmp/deadline-oracle.mjs').write_bytes(base64.b64decode(''))\n\
        PREP"
    - name: Locked dependencies
      run: pnpm install --frozen-lockfile > /tmp/install.log 2>&1
    - name: Actual Chromium prerequisites
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
        > /tmp/browser-install.log 2>&1
    - name: Build actual production modules
      run: pnpm build > /tmp/build.log 2>&1
    - name: Real Chromium maintained download regressions and existing boundaries
      run: "set +e\nif test \"$VARIANT\" = baseline; then\n pnpm --filter @e2e-dev/web\
        \ exec vitest run --project integration tests/integration/routes.test.ts -t\
        \ 'closes started downloads while its trigger is still pending' --reporter=junit\
        \ --outputFile=/tmp/routes.xml > /tmp/routes.log 2>&1\nelse\n pnpm --filter\
        \ @e2e-dev/web exec vitest run --project integration tests/integration/routes.test.ts\
        \ tests/integration/provider-downloads.test.ts --reporter=junit --outputFile=/tmp/routes.xml\
        \ > /tmp/routes.log 2>&1\nfi\ncode=$?\nset -e\nexport NATIVE_EXIT=\"$code\"\
        \npython - <<'EVAL'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as E,json,os\nr=E.parse('/tmp/routes.xml').getroot();c=r.findall('.//testcase');f=r.findall('.//failure');assert\
        \ not r.findall('.//error')\nif os.environ['VARIANT']=='baseline':\n selected=[x\
        \ for x in c if x.find('skipped') is None];assert len(selected)==2 and len(f)==2\
        \ and all(x.get('type')=='AssertionError' for x in f) and os.environ['NATIVE_EXIT']=='1'\n\
        else:assert not f and len(c)>=36 and os.environ['NATIVE_EXIT']=='0'\nPath('/tmp/native-counts.json').write_text(json.dumps({'variant':os.environ['VARIANT'],'cases':len(c),'failed':len(f),'skipped':len(r.findall('.//skipped'))},indent=2))\n\
        EVAL"
    - name: Unchanged actual built CLI download timing regression
      if: matrix.variant == 'candidate'
      run: 'python - <<''OBS''

        from pathlib import Path

        p=Path(''packages/e2e/tests/helpers/run-project.ts'');s=p.read_text();Path(''/tmp/original-run-project.ts'').write_bytes(p.read_bytes());needle="  const
        result = outcome.results.find((candidate) => candidate.test.title === title
        && candidate.repeat === repeat);";assert s.count(needle)==1;p.write_text(s.replace(needle,needle+"\n  if
        (title === ''a trigger that starts no download times out saying so'') writeFileSync(''/tmp/built-download-report.json'',
        JSON.stringify(outcome.report, null, 2));"))

        OBS

        pnpm --filter e2e exec vitest run --project integration tests/integration/web-platform.test.ts
        -t ''fails a download that never started with the wait and the trigger time,
        not a bare timeout$'' --reporter=junit --outputFile=/tmp/built.xml > /tmp/built.log
        2>&1'
    - name: Candidate relevant typecheck and lint
      if: matrix.variant == 'candidate'
      run: 'pnpm --filter @e2e-dev/web run typecheck > /tmp/typecheck.log 2>&1

        pnpm lint > /tmp/lint.log 2>&1'
    - name: Final exact source guards
      if: always()
      run: 'python - <<''GUARD''

        from pathlib import Path

        import json,hashlib

        original=Path(''/tmp/original-run-project.ts'')

        if original.exists(): Path(''packages/e2e/tests/helpers/run-project.ts'').write_bytes(original.read_bytes())

        p=json.loads(Path(''/tmp/expected-source.json'').read_text());assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h
        for f,h in p.items())

        Path(''/tmp/source-guard.json'').write_text(json.dumps({''exact_variant_bytes'':True}))

        GUARD'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: download-native-${{ matrix.variant }}
        path: '/tmp/install.log

          /tmp/browser-install.log

          /tmp/build.log

          /tmp/candidate.patch

          /tmp/expected-source.json

          /tmp/routes.log

          /tmp/routes.xml

          /tmp/native-counts.json

          /tmp/built.xml

          /tmp/built.log

          /tmp/built-download-report.json

          /tmp/typecheck.log

          /tmp/lint.log

          /tmp/source-guard.json'
        if-no-files-found: error
