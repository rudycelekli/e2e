name: E2E1048 exact download failure classification
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref:
        - 861fd962f07c5cc638e1a4df78b77d2701ce990d
        - d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        - 6de152caff51a79311454a5367eb842d191ecba4
    env:
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.0
    - name: Locked dependencies
      run: pnpm install --frozen-lockfile > /tmp/install.log 2>&1
    - name: Actual browser installation
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
        > /tmp/browser-install.log 2>&1
    - name: Build actual public packages
      run: pnpm build > /tmp/build.log 2>&1
    - name: Freeze exact source and materialize readonly outcome observer
      run: 'python - <<''PREP''

        from pathlib import Path

        import json,hashlib,subprocess

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD'']).decode().strip()==''${{
        matrix.ref }}''

        files=subprocess.check_output([''git'',''ls-files'',''-z'']).decode().split(''\0'')[:-1]

        identity={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files
        if Path(f).is_file()}

        Path(''/tmp/source-identity.json'').write_text(json.dumps(identity))

        p=Path(''packages/e2e/tests/helpers/run-project.ts'');s=p.read_text();Path(''/tmp/original-run-project.ts'').write_bytes(p.read_bytes())

        needle="  const result = outcome.results.find((candidate) => candidate.test.title
        === title && candidate.repeat === repeat);"

        assert s.count(needle)==1

        s=s.replace(needle,needle+"\n  if (title === ''a trigger that starts no download
        times out saying so'') writeFileSync(''/tmp/download-outcome.json'', JSON.stringify({
        result, report: outcome.report }, null, 2));")

        needle="cleanup: () => rmSync(dir, { recursive: true, force: true }),";assert
        s.count(needle)==1

        s=s.replace(needle,"cleanup: () => { rmSync(dir, { recursive: true, force:
        true }); writeFileSync(''/tmp/fixture-cleanup.json'', JSON.stringify({ removed:
        !existsSync(dir) })); },")

        s=s.replace("import { mkdirSync,", "import { existsSync, mkdirSync,")

        p.write_text(s)

        Path(''/tmp/observer-helper.ts'').write_bytes(p.read_bytes())

        PREP'
    - name: One unchanged assertion with native built fixture batch
      run: 'set +e

        pnpm --filter e2e exec vitest run --project integration tests/integration/web-platform.test.ts
        -t ''^web platform integration > fails a download that never started with
        the wait and the trigger time, not a bare timeout$'' --reporter=junit --outputFile=/tmp/targeted.xml
        > /tmp/targeted.log 2>&1

        code=$?

        set -e

        export TEST_EXIT="$code"

        python - <<''EVAL''

        import os,json,xml.etree.ElementTree as E

        from pathlib import Path

        r=E.parse(''/tmp/targeted.xml'').getroot();cases=r.findall(''.//testcase'');selected=[x
        for x in cases if x.find(''skipped'') is None]

        assert len(selected)==1,(len(selected),[(x.get(''name''),x.find(''skipped'')
        is None) for x in cases])

        assert not r.findall(''.//error'')

        f=selected[0].find(''failure'');code=int(os.environ[''TEST_EXIT'']);assert
        (code==0 and f is None) or(code==1 and f is not None and f.get(''type'')==''AssertionError''),(code,E.tostring(r).decode())

        assert Path(''/tmp/download-outcome.json'').exists()

        assert json.loads(Path(''/tmp/fixture-cleanup.json'').read_text())[''removed'']

        Path(''/tmp/classification.json'').write_text(json.dumps({''ref'':''${{ matrix.ref
        }}'',''test_exit'':code,''selected'':1,''other_skipped'':len(cases)-1,''assertion_failures'':int(f
        is not None),''failure'':None if f is None else ''''.join(f.itertext())},indent=2))

        EVAL'
    - name: Restore observer and verify all tracked source
      if: always()
      run: 'python - <<''GUARD''

        from pathlib import Path

        import hashlib,json

        p=Path(''packages/e2e/tests/helpers/run-project.ts'');p.write_bytes(Path(''/tmp/original-run-project.ts'').read_bytes())

        identity=json.loads(Path(''/tmp/source-identity.json'').read_text());assert
        all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in identity.items())

        Path(''/tmp/source-guard.json'').write_text(json.dumps({''all_tracked_bytes_unchanged_after_observer_restore'':True}))

        GUARD

        git diff --exit-code'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: download1048-${{ matrix.ref }}
        path: '/tmp/install.log

          /tmp/browser-install.log

          /tmp/build.log

          /tmp/source-identity.json

          /tmp/original-run-project.ts

          /tmp/observer-helper.ts

          /tmp/targeted.log

          /tmp/targeted.xml

          /tmp/classification.json

          /tmp/download-outcome.json

          /tmp/fixture-cleanup.json

          /tmp/source-guard.json'
        if-no-files-found: error
