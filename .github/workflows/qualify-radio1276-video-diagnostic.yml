name: Native video1276 UI positive control diagnosis
'on':
  workflow_dispatch: {}
  push:
    branches:
    - validation-radio1276-video-diagnostic-20261020
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'rudycelekli/e2e' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 1568435e5456b274e038ad8673d09978bb4a90c8
        persist-credentials: false
    - name: Guard frozen production and save identity
      run: |
        test "$(git rev-parse HEAD)" = 1568435e5456b274e038ad8673d09978bb4a90c8
        git diff --exit-code
        python3 - "$RUNNER_TEMP/source.json" save <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
    - name: Apply only exact reviewed source candidate without a source commit
      run: |
        python3 - <<'PYTHON'
        import base64,hashlib,pathlib,subprocess,json
        raw=base64.b64decode('')
        assert hashlib.sha256(raw).hexdigest()=='1afa9e4d5c294da9ff3986a71fa24b3f9f4c1445a0af0caee56a0dc63dd9d107'
        path=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'candidate.patch';path.write_bytes(raw)
        files=subprocess.check_output(['git','apply','--numstat',str(path)]).decode().splitlines()
        assert sorted(row.split('\t')[-1] for row in files)==sorted({'.changeset/styled-native-check-label.md': '1b2ef33978663c526d5727ce322193eed2b131476252784584a96f75636bfe9b', 'docs/reference/screen.mdx': '59bf868cbdb08e999dc97c225d3bf87d83bb30271d4100918144dc77caad066d', 'packages/web/src/actions.ts': 'a50ff0e93cab0620d6718a350456470a479f02cabf7ebc43e18e1b263b86bcce', 'packages/web/tests/integration/check-actions.test.ts': '61872257bb8d1f82bd09dbc6c60b16368736e13880d220459416b2d2123ee9e8', 'plugins/e2e/skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36', 'skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36'})
        subprocess.run(['git','apply','--check',str(path)],check=True)
        subprocess.run(['git','apply',str(path)],check=True)
        subprocess.run(['git','add','--intent-to-add','.changeset/styled-native-check-label.md'],check=True)
        for filename,digest in {'.changeset/styled-native-check-label.md': '1b2ef33978663c526d5727ce322193eed2b131476252784584a96f75636bfe9b', 'docs/reference/screen.mdx': '59bf868cbdb08e999dc97c225d3bf87d83bb30271d4100918144dc77caad066d', 'packages/web/src/actions.ts': 'a50ff0e93cab0620d6718a350456470a479f02cabf7ebc43e18e1b263b86bcce', 'packages/web/tests/integration/check-actions.test.ts': '61872257bb8d1f82bd09dbc6c60b16368736e13880d220459416b2d2123ee9e8', 'plugins/e2e/skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36', 'skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36'}.items():assert hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()==digest
        canonical=subprocess.check_output(['git','diff','--binary','--full-index'])
        assert hashlib.sha256(canonical).hexdigest()=='1afa9e4d5c294da9ff3986a71fa24b3f9f4c1445a0af0caee56a0dc63dd9d107'
        PYTHON
        python3 - "$RUNNER_TEMP/candidate-source.json" save <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
    - name: Build actual frozen packages and install Chromium
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter e2e run build
        pnpm --filter @e2e-dev/web run build
        pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
      id: build
    - name: Verify and unpack pinned real component bundles
      run: |
        python3 - <<'PYTHON'
        import urllib.request, hashlib, base64, tarfile, io, os, pathlib, json
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'element-plus-assets'
        root.mkdir()
        for package in [{'name': 'vue', 'version': '3.5.44', 'url': 'https://registry.npmjs.org/vue/-/vue-3.5.44.tgz', 'integrity': 'sha512-dvvmaOCG7lAMkJTPqPwWeGMsPS6DIsFsfZDUgBp9V6mHf9b3+/wyVwYR4Es+WV6uJC0FKRxp81Obcq0ZwUcGFQ=='}, {'name': 'element-plus', 'version': '2.14.7', 'url': 'https://registry.npmjs.org/element-plus/-/element-plus-2.14.7.tgz', 'integrity': 'sha512-lrG7pZyCS+mpCNVpzxxyu5r35+T6V0hzkAeIwn7HA6to772XSTHKuYCZG51OfzlqaxGbNegLxs650zAF1j43gA=='}]:
            raw = urllib.request.urlopen(package['url'], timeout=30).read()
            assert 'sha512-' + base64.b64encode(hashlib.sha512(raw).digest()).decode() == package['integrity']
            stage = root / ('.' + package['name'])
            stage.mkdir()
            with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
                archive.extractall(stage, filter='data')
            (stage / 'package').rename(root / package['name'])
        print(json.dumps([{'name': 'vue', 'version': '3.5.44', 'url': 'https://registry.npmjs.org/vue/-/vue-3.5.44.tgz', 'integrity': 'sha512-dvvmaOCG7lAMkJTPqPwWeGMsPS6DIsFsfZDUgBp9V6mHf9b3+/wyVwYR4Es+WV6uJC0FKRxp81Obcq0ZwUcGFQ=='}, {'name': 'element-plus', 'version': '2.14.7', 'url': 'https://registry.npmjs.org/element-plus/-/element-plus-2.14.7.tgz', 'integrity': 'sha512-lrG7pZyCS+mpCNVpzxxyu5r35+T6V0hzkAeIwn7HA6to772XSTHKuYCZG51OfzlqaxGbNegLxs650zAF1j43gA=='}], indent=2))
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('ELEMENT_PLUS_BUNDLES=' + str(root) + '\n')
        PYTHON
    - name: Generate deterministic local playable media controls
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          sudo apt-get update
          apt-cache policy ffmpeg > "$RUNNER_TEMP/radio1276-ffmpeg-package-policy.log"
          sudo apt-get install --no-install-recommends -y ffmpeg
        fi
        command -v ffmpeg
        ffmpeg -version > "$RUNNER_TEMP/radio1276-media-toolchain.log"
        mkdir -p "$RUNNER_TEMP/local-media"
        ffmpeg -nostdin -y -v error -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=8" -c:a pcm_s16le "$RUNNER_TEMP/local-media/tone.wav"
        ffmpeg -nostdin -y -v error -f lavfi -i "color=c=black:s=320x180:r=10:d=8" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=8" -c:v libvpx-vp9 -deadline realtime -cpu-used 8 -c:a libopus -shortest "$RUNNER_TEMP/local-media/clip.webm"
        ffprobe -v error -show_streams -show_format -of json "$RUNNER_TEMP/local-media/clip.webm" > "$RUNNER_TEMP/radio1276-video-metadata.json"
        echo "MEDIA_PROBE_ASSETS=$RUNNER_TEMP/local-media" >> "$GITHUB_ENV"
    - name: Stage controlled real-component user fixture only
      run: |
        python3 - <<'PYTHON'
        import base64,pathlib
        root=pathlib.Path('apps/testbed/1276-fixture');root.mkdir()
        for name,data in {'server.mjs': '', 'e2e.config.ts': '', 'radio.e2e.ts': '', 'adversarial.e2e.ts': ''}.items():
            target=root.parent/'e2e.radio1276.config.ts' if name=='e2e.config.ts' else root/name
            target.write_bytes(base64.b64decode(data))
        PYTHON
    - name: Run actual built CLI component and adversarial probes
      working-directory: apps/testbed
      run: |
        set +e
        node node_modules/e2e/dist/cli/bin.js run --config e2e.radio1276.config.ts --video --reporter json > "$RUNNER_TEMP/radio1276-probes-report.json" 2> "$RUNNER_TEMP/radio1276-probes-stderr.log"
        code=$?
        set -e
        printf '%s\n' "$code" > "$RUNNER_TEMP/radio1276-probes-exit.txt"
        # Preserve every native result. A failed contract probe remains a failed workflow,
        # not a source qualification or an infrastructure failure credited as a repro.
        test "$code" -eq 0
      id: native
      continue-on-error: true
      if: success() && steps.build.outcome == 'success'
    - name: Retain exact one video diagnostic outcome
      if: always() && steps.build.outcome == 'success'
      run: |
        python3 - <<'PYTHON'
        import json,os,pathlib
        r=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'radio1276-probes-report.json'))['run']
        assert not r['errors'],r['errors']
        assert len(r['results'])==1 and r['summary']['discovered']==1 and r['summary']['selected']==1 and r['summary']['executed']==1 and r['summary']['skipped']==0
        assert r['results'][0]['titlePath'][-1]=='does not proxy a click into native video controls'
        assert all(a['cleanup']=='complete'for a in r['results'][0]['attempts'])
        # A failing positive control stays a failing diagnostic run; screenshots/video explain the gate.
        assert r['summary']['passed']==1 and r['results'][0]['status']=='passed',r['results'][0]['attempts'][0].get('error')
        PYTHON
    - name: Verify final exact candidate source identity
      if: always()
      run: |
        python3 - "$RUNNER_TEMP/candidate-source.json" verify <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
        git diff --check
        python3 - <<'PYTHON'
        import subprocess,hashlib
        assert hashlib.sha256(subprocess.check_output(['git','diff','--binary','--full-index'])).hexdigest()=='1afa9e4d5c294da9ff3986a71fa24b3f9f4c1445a0af0caee56a0dc63dd9d107'
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: radio1276-video-diagnostic
        path: |-
          ${{ runner.temp }}/radio1276-*
          ${{ runner.temp }}/check-actions-after.json
          ${{ runner.temp }}/source.json
          ${{ runner.temp }}/candidate-source.json
          apps/testbed/.e2e/results/
        retention-days: 7
