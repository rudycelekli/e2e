name: Fork e2e1044 native qualification
on:
  push:
    branches: [validation/e2e1044-native-20261017]
permissions:
  contents: read
concurrency:
  group: fork-e2e1044-native
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'rudycelekli/e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e87299950ffcfc2ed7f8efa09f28a6a62d8101c4
          fetch-depth: 3
          persist-credentials: false
      - name: Guard frozen source
        run: |
          test "$(git rev-parse HEAD)" = e87299950ffcfc2ed7f8efa09f28a6a62d8101c4
          test "$(git rev-parse HEAD^{tree})" = 4cdc10e8ba27e6d1bce490b04ce4de92a999d731
          test "$(git show -s --format=%P HEAD)" = "cb16fd8fe9492dcbe24a8bfaeac4d9fc0ebb645b ff3bf3917f2b5bb0f81e5bc5f4fdaa24d023afd0"
          git diff --exit-code
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - name: Install exact lockfile and build native packages
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Native full core unit suite
        run: pnpm --filter e2e run test:unit
      - name: Required full repository checks
        run: pnpm check
      - name: Install deterministic local Chromium
        run: node packages/web/dist/bin.js install chromium --with-deps
      - name: Native route fetch and response composition
        run: pnpm --filter @e2e-dev/web exec vitest run tests/integration/routes.test.ts tests/integration/wait-for-response.test.ts
      - name: Built CLI deterministic testbed
        run: pnpm --filter @e2e-dev/testbed test
      - name: Built CLI deterministic web benchmark
        run: pnpm --filter @e2e-dev/web-benchmark test
      - name: Final frozen source guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = e87299950ffcfc2ed7f8efa09f28a6a62d8101c4
          test "$(git rev-parse HEAD^{tree})" = 4cdc10e8ba27e6d1bce490b04ce4de92a999d731
          git diff --exit-code
