name: Native radio1276 interactive label geometry
'on':
  workflow_dispatch: {}
  push:
    branches:
    - validation-radio1276-geometry-20261020
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'rudycelekli/e2e' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 1568435e5456b274e038ad8673d09978bb4a90c8
        persist-credentials: false
    - name: Guard frozen production and save identity
      run: |
        test "$(git rev-parse HEAD)" = 1568435e5456b274e038ad8673d09978bb4a90c8
        git diff --exit-code
        python3 - "$RUNNER_TEMP/source.json" save <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
    - name: Install frozen dependencies and native Chromium only
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
      id: build
    - name: Diagnose original and explicit covering fixture geometry
      working-directory: packages/web
      run: |
        python3 - <<'PYTHON'
        import base64,pathlib
        pathlib.Path('geometry1276.mjs').write_bytes(base64.b64decode(''))
        PYTHON
        GEOMETRY_OUTPUT="$RUNNER_TEMP/geometry1276.json" node geometry1276.mjs
        git diff --exit-code
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: geometry1276
        path: |-
          ${{ runner.temp }}/geometry1276.json
          ${{ runner.temp }}/source.json
        retention-days: 7
