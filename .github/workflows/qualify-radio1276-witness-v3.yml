name: Native radio1276 timeout public contract correction
'on':
  workflow_dispatch: {}
  push:
    branches:
    - validation-radio1276-witness-v3-20261020
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'rudycelekli/e2e' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 1568435e5456b274e038ad8673d09978bb4a90c8
        persist-credentials: false
    - name: Guard frozen production and save identity
      run: |
        test "$(git rev-parse HEAD)" = 1568435e5456b274e038ad8673d09978bb4a90c8
        git diff --exit-code
        python3 - "$RUNNER_TEMP/source.json" save <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
    - name: Apply only exact reviewed source candidate without a source commit
      run: |
        python3 - <<'PYTHON'
        import base64,hashlib,pathlib,subprocess,json
        raw=base64.b64decode('')
        assert hashlib.sha256(raw).hexdigest()=='784cb7285d6ebf7979f95c7abbdcfb8ed19cf3d0ee8705e628a5a72d4b8b9106'
        path=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'candidate.patch';path.write_bytes(raw)
        files=subprocess.check_output(['git','apply','--numstat',str(path)]).decode().splitlines()
        assert sorted(row.split('\t')[-1] for row in files)==sorted({'.changeset/styled-native-check-label.md': '1b2ef33978663c526d5727ce322193eed2b131476252784584a96f75636bfe9b', 'docs/reference/screen.mdx': '59bf868cbdb08e999dc97c225d3bf87d83bb30271d4100918144dc77caad066d', 'packages/web/src/actions.ts': '221132ebdfc9fe2633ec58e40631205a5e631869e10681b588ea25929ff3a52c', 'packages/web/tests/integration/check-actions.test.ts': 'd4b5150a786499aff5b8cdfd21aec9ead9e52c3d8c730a333fe2b5d1ea996152', 'plugins/e2e/skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36', 'skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36'})
        subprocess.run(['git','apply','--check',str(path)],check=True)
        subprocess.run(['git','apply',str(path)],check=True)
        subprocess.run(['git','add','--intent-to-add','.changeset/styled-native-check-label.md'],check=True)
        for filename,digest in {'.changeset/styled-native-check-label.md': '1b2ef33978663c526d5727ce322193eed2b131476252784584a96f75636bfe9b', 'docs/reference/screen.mdx': '59bf868cbdb08e999dc97c225d3bf87d83bb30271d4100918144dc77caad066d', 'packages/web/src/actions.ts': '221132ebdfc9fe2633ec58e40631205a5e631869e10681b588ea25929ff3a52c', 'packages/web/tests/integration/check-actions.test.ts': 'd4b5150a786499aff5b8cdfd21aec9ead9e52c3d8c730a333fe2b5d1ea996152', 'plugins/e2e/skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36', 'skills/e2e/references/writing-tests.md': 'b26a8be549552a47525657a440dd8429be57d5b32e34828dcd7560a97704ec36'}.items():assert hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()==digest
        canonical=subprocess.check_output(['git','diff','--binary','--full-index'])
        assert hashlib.sha256(canonical).hexdigest()=='784cb7285d6ebf7979f95c7abbdcfb8ed19cf3d0ee8705e628a5a72d4b8b9106'
        PYTHON
        python3 - "$RUNNER_TEMP/candidate-source.json" save <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
    - name: Build actual frozen packages and install Chromium
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter e2e run build
        pnpm --filter @e2e-dev/web run build
        pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
      id: build
    - name: Run original and new actual browser integration cases
      run: |
        set +e
        pnpm --filter @e2e-dev/web exec vitest run tests/integration/check-actions.test.ts --project integration --reporter=json --outputFile="$RUNNER_TEMP/check-actions-after.json"
        code=$?
        set -e
        printf '%s\n' "$code" > "$RUNNER_TEMP/radio1276-integration-exit.txt"
        test "$code" -eq 0
      id: integration
      continue-on-error: true
    - name: Strict39 real browser integration report gate
      if: always() && steps.build.outcome == 'success'
      run: |
        python3 - <<'PYTHON'
        import base64,pathlib,os
        pathlib.Path(os.environ['RUNNER_TEMP'],'evaluate1276.py').write_bytes(base64.b64decode(''))
        PYTHON
        python3 "$RUNNER_TEMP/evaluate1276.py" integration "$RUNNER_TEMP/check-actions-after.json"
        test "$(cat "$RUNNER_TEMP/radio1276-integration-exit.txt")" = 0
    - name: Verify final exact candidate source identity
      if: always()
      run: |
        python3 - "$RUNNER_TEMP/candidate-source.json" verify <<'PYTHON'
        import hashlib,json,subprocess,pathlib,sys
        paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
        identity={p.decode():hashlib.sha256(pathlib.Path(p.decode()).read_bytes()).hexdigest() for p in paths if p and pathlib.Path(p.decode()).is_file()}
        path=pathlib.Path(sys.argv[1])
        if sys.argv[2]=='save':path.write_text(json.dumps(identity,sort_keys=True))
        else:assert identity==json.loads(path.read_text())
        PYTHON
        git diff --check
        python3 - <<'PYTHON'
        import subprocess,hashlib
        assert hashlib.sha256(subprocess.check_output(['git','diff','--binary','--full-index'])).hexdigest()=='784cb7285d6ebf7979f95c7abbdcfb8ed19cf3d0ee8705e628a5a72d4b8b9106'
        PYTHON
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: radio1276-witness-v3-integration
        path: |-
          ${{ runner.temp }}/radio1276-*
          ${{ runner.temp }}/check-actions-after.json
          ${{ runner.temp }}/source.json
          ${{ runner.temp }}/candidate-source.json
        retention-days: 7
