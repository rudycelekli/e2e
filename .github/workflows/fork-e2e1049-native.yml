name: Fork e2e1049 native qualification
on:
  push:
    branches: [validation/e2e1049-native-20261016]
permissions:
  contents: read
concurrency:
  group: fork-e2e1049-native
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 930cbea792e3c5076c2f34768a0098d7d148a59e
          fetch-depth: 3
          persist-credentials: false
      - name: Guard frozen source
        run: |
          test "$(git rev-parse HEAD)" = 930cbea792e3c5076c2f34768a0098d7d148a59e
          test "$(git rev-parse HEAD^{tree})" = c874a9c7af2a8202771fa02b83a910bbd8ff3caf
          test "$(git show -s --format=%P HEAD)" = "99f127c600b2bf3b787c3f5025407d4e9cead30e ff3bf3917f2b5bb0f81e5bc5f4fdaa24d023afd0"
          git diff --exit-code
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - name: Install exact lockfile and build native packages
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Native locator union and engine regressions
        run: |
          pnpm --filter e2e exec vitest run tests/unit/locator-union.test.ts
          pnpm --filter @e2e-dev/web exec vitest run tests/unit/locators.test.ts
          pnpm --filter @e2e-dev/mobile exec vitest run tests/unit/locate.test.ts
      - name: Native full core unit suite
        run: pnpm --filter e2e run test:unit
      - name: Required full repository checks
        run: pnpm check
      - name: Install deterministic local Chromium
        run: node packages/web/dist/bin.js install chromium --with-deps
      - name: Native browser label composition
        run: pnpm --filter @e2e-dev/web exec vitest run tests/integration/label-composition.test.ts
      - name: Built CLI deterministic testbed
        run: pnpm --filter @e2e-dev/testbed test
      - name: Built CLI deterministic web benchmark
        run: pnpm --filter @e2e-dev/web-benchmark test
      - name: Final frozen source guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = 930cbea792e3c5076c2f34768a0098d7d148a59e
          test "$(git rev-parse HEAD^{tree})" = c874a9c7af2a8202771fa02b83a910bbd8ff3caf
          git diff --exit-code
