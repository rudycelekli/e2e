name: Private1276 baseline candidate exact runner failure classification
'on':
  workflow_dispatch: null
  push:
    branches:
    - validation-radio1276-node22-pair-20261021
    paths:
    - .github/workflows/qualify-radio1276-full.yml
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage:
        - baseline
        - candidate
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: "python -c \"import base64,gzip;exec(gzip.decompress(base64.b64decode('')))\"\
        \nif [ \"$STAGE\" = baseline ]; then\n  git reset --hard HEAD\n  git diff --exit-code HEAD\n  git ls-files -z | sha256sum > \"$EVIDENCE/base-paths.sha256\"\
        \nfi"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Install browsers
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Build actual frozen repository
      run: pnpm run build 2>&1 | tee "$EVIDENCE/build.log"
    - name: Actual exact failing runner test
      run: pnpm --filter e2e exec vitest run --project integration tests/integration/parallel-workers.test.ts -t "keeps the failed attempt before a retry that blocked
        its worker, and runs the next test" 2>&1 | tee "$EVIDENCE/test.log"
    - name: Exact stage source identity
      if: always()
      run: if [ "$STAGE" = baseline ]; then git diff --exit-code HEAD; else python -c "import os,subprocess;from pathlib import Path;q=Path(os.environ['EVIDENCE']);assert
        subprocess.check_output(['git','diff','--binary','--full-index','HEAD'])==(q/'candidate.patch').read_bytes()"; fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: radio1276-node22-${{ matrix.stage }}
        path: /tmp/radio1276-node22-*
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-node22-${{ matrix.stage }}
      E2E_TELEMETRY_DISABLED: '1'
      STAGE: ${{ matrix.stage }}
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
