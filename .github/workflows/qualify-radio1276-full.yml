name: Private 1276 exact source full deterministic gates
'on':
  workflow_dispatch: null
  push:
    branches:
    - validation-radio1276-full-lint-20261021
    paths:
    - .github/workflows/qualify-radio1276-full.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Lint
      run: pnpm lint 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Dead code (fallow)
      run: pnpm check:dead-code 2>&1 | tee "$EVIDENCE/step-5.log"
    - name: Typecheck packages
      run: pnpm typecheck 2>&1 | tee "$EVIDENCE/step-6.log"
    - name: Error code reference
      run: pnpm docs:check-errors 2>&1 | tee "$EVIDENCE/step-7.log"
    - name: Peer ranges on the runner
      run: pnpm check:peer-ranges 2>&1 | tee "$EVIDENCE/step-8.log"
    - name: Changeset bumps on 0.x packages
      run: pnpm check:changeset-bumps 2>&1 | tee "$EVIDENCE/step-9.log"
    - name: No install scripts in published dependency trees
      run: pnpm check:install-scripts 2>&1 | tee "$EVIDENCE/step-10.log"
    - name: Plugin package matches its sources
      run: pnpm plugins:check 2>&1 | tee "$EVIDENCE/step-11.log"
    - name: MCP Registry entry matches the runner
      run: pnpm mcp-server:check 2>&1 | tee "$EVIDENCE/step-12.log"
    - uses: ./.github/actions/mcp-publisher
    - name: MCP Registry accepts the entry
      run: '"$RUNNER_TEMP/mcp-publisher" validate packages/e2e/server.json 2>&1 | tee "$EVIDENCE/step-14.log"'
    - name: Agent skill scripts
      run: 'pnpm exec tsc -p .dev/skills/babysit/scripts

        node --test .dev/skills/babysit/scripts/pr-status.test.ts

        '
    - name: Install browsers
      run: node packages/web/dist/bin.js install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-16.log"
    - name: Testbed
      run: pnpm --filter @e2e-dev/testbed test 2>&1 | tee "$EVIDENCE/step-17.log"
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-full-check-${{ strategy.job-index }}
        path: '${{ runner.temp }}/radio1276-full-*

          apps/web-benchmark/.e2e

          apps/testbed/.e2e'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-full-check-${{ strategy.job-index }}
      E2E_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22
        - 24
        - 26
        - 22.22.3
        - 24.8.0
      max-parallel: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ matrix.node }}
        check-latest: true
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Install browsers
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Unit and integration tests
      run: pnpm test 2>&1 | tee "$EVIDENCE/step-5.log"
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-full-test-${{ strategy.job-index }}
        path: '${{ runner.temp }}/radio1276-full-*

          apps/web-benchmark/.e2e

          apps/testbed/.e2e'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-full-test-${{ strategy.job-index }}
      E2E_TELEMETRY_DISABLED: '1'
    needs:
    - check
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pnpm:
        - 11
        - 12
      max-parallel: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - run: pnpm run build 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Fresh install with pnpm ${{ matrix.pnpm }}
      run: node scripts/install-smoke.ts ${{ matrix.pnpm }} 2>&1 | tee "$EVIDENCE/step-5.log"
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-full-install-${{ strategy.job-index }}
        path: '${{ runner.temp }}/radio1276-full-*

          apps/web-benchmark/.e2e

          apps/testbed/.e2e'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-full-install-${{ strategy.job-index }}
      E2E_TELEMETRY_DISABLED: '1'
    needs:
    - check
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Install browsers
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Build
      run: pnpm run build 2>&1 | tee "$EVIDENCE/step-5.log"
    - name: Run test
      run: pnpm --filter @e2e-dev/web-benchmark run test 2>&1 | tee "$EVIDENCE/step-6.log"
    - name: Cross-check the tree
      env:
        CROSSCHECK_BENCHMARK_URL: http://127.0.0.1:4280
      run: "setsid pnpm --filter @e2e-dev/web-benchmark run start > \"$EVIDENCE/benchmark-app.log\" 2>&1 &\nserver_pid=$!\ncleanup() {\n  kill -TERM -- \"-$server_pid\"\
        \ 2>/dev/null || true\n  for _ in $(seq 1 50); do if ! kill -0 \"$server_pid\" 2>/dev/null; then break; fi; sleep 0.1; done\n  if kill -0 \"$server_pid\"\
        \ 2>/dev/null; then kill -KILL -- \"-$server_pid\" 2>/dev/null || true; fi\n  for _ in $(seq 1 20); do if ! kill -0 \"$server_pid\" 2>/dev/null; then break;\
        \ fi; sleep 0.1; done\n  if kill -0 \"$server_pid\" 2>/dev/null; then echo 'Owned benchmark process failed bounded cleanup' >&2; return 1; fi\n  wait \"$server_pid\"\
        \ 2>/dev/null || true\n}\ntrap cleanup EXIT\nready=0\nfor _ in $(seq 1 60); do if curl -sf \"$CROSSCHECK_BENCHMARK_URL\" >/dev/null; then ready=1; break;\
        \ fi; sleep 1; done\n[ \"$ready\" = 1 ]\npnpm --filter @e2e-dev/web exec vitest run --project integration tests/integration/crosscheck.test.ts"
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-full-benchmark-${{ strategy.job-index }}
        path: '${{ runner.temp }}/radio1276-full-*

          apps/web-benchmark/.e2e

          apps/testbed/.e2e'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-full-benchmark-${{ strategy.job-index }}
      E2E_TELEMETRY_DISABLED: '1'
    needs:
    - check
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
  docs:
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - run: pnpm docs:check 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Materialize actual docs preview helper
      run: python -c "import base64,os;from pathlib import Path;Path(os.environ['EVIDENCE'],'render.mjs').write_bytes(base64.b64decode(''))"
    - run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Render baseline reference then restore candidate
      run: node "$EVIDENCE/render.mjs" baseline
    - name: Render candidate reference
      run: node "$EVIDENCE/render.mjs" candidate
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-full-docs-${{ strategy.job-index }}
        path: '${{ runner.temp }}/radio1276-full-*

          apps/web-benchmark/.e2e

          apps/testbed/.e2e'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVIDENCE: /tmp/radio1276-full-docs-${{ strategy.job-index }}
      E2E_TELEMETRY_DISABLED: '1'
    needs:
    - check
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
  paired-ab:
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Canonical six-pair deterministic benchmark
      run: node scripts/bench-ab.ts --base d7c6b5e5a4c27fac7633e66866fd367b0351ead8 --suite web-benchmark --workers 1 --min-pairs 6 --max-pairs 6 --warmup 1 --timeout
        30 --out "$EVIDENCE/paired-ab" 2>&1 | tee "$EVIDENCE/step-5.log"
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-full-paired-ab-${{ strategy.job-index }}
        path: '${{ runner.temp }}/radio1276-full-*

          apps/web-benchmark/.e2e

          apps/testbed/.e2e'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVIDENCE: /tmp/radio1276-full-paired-ab-${{ strategy.job-index }}
      E2E_TELEMETRY_DISABLED: '1'
    needs:
    - check
    - benchmark
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
  gate:
    runs-on: ubuntu-24.04
    needs:
    - check
    - test
    - install
    - benchmark
    - docs
    - paired-ab
    if: always()
    timeout-minutes: 5
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
      run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
