name: Private1276 main versus direct native fast path six paired cases
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        check-latest: true
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Install browsers
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Six exact control-inventory pairs against original main
      run: 'git ls-tree -r --full-tree HEAD apps/web-benchmark > "$EVIDENCE/fixture-tree.txt"

        node scripts/bench-ab.ts --base d7c6b5e5a4c27fac7633e66866fd367b0351ead8 --suite web-benchmark --workers 1 --min-pairs 6 --max-pairs 6 --warmup 1 --timeout
        10 --out "$EVIDENCE/paired-ab" -- --grep "check sets the checkbox and the radio without flipping a set one" 2>&1 | tee "$EVIDENCE/paired-ab.log"

        git ls-tree -r --full-tree HEAD apps/web-benchmark > "$EVIDENCE/fixture-tree-after.txt"

        cmp "$EVIDENCE/fixture-tree.txt" "$EVIDENCE/fixture-tree-after.txt"'
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-direct-main-pairs
        path: ${{ env.EVIDENCE }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-direct-main-pairs
      E2E_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
