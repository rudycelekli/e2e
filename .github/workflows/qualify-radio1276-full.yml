name: Private1276 measured one-RPC optimization
'on':
  workflow_dispatch: null
  push:
    branches:
    - validation-radio1276-control-perf-20261021
    paths:
    - .github/workflows/qualify-radio1276-full.yml
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        check-latest: true
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Install browsers
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/step-4.log"
    - name: Freeze prior source commit, fixture and one-RPC optimization
      run: python -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')))"
    - name: Six exact control-inventory paired measurements
      run: node scripts/bench-ab.ts --base "$(cat "$EVIDENCE/prior-candidate-commit.txt")" --suite web-benchmark --workers 1 --min-pairs 6 --max-pairs 6 --warmup
        1 --timeout 10 --out "$EVIDENCE/paired-ab" -- --grep "check sets the checkbox and the radio without flipping a set one" 2>&1 | tee "$EVIDENCE/paired-ab.log"
    - name: Strict final optimized source and fixture identity
      if: always()
      run: python -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')))"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: radio1276-control-perf
        path: ${{ env.EVIDENCE }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    env:
      EVIDENCE: /tmp/radio1276-control-perf
      E2E_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
