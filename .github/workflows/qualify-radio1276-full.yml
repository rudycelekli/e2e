name: Private1276 actual baseline and candidate docs diagnostic
'on':
  workflow_dispatch: null
  push:
    branches:
    - validation-radio1276-docs-diagnostic-20261021
    paths:
    - .github/workflows/qualify-radio1276-full.yml
permissions:
  contents: read
jobs:
  docs:
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: d7c6b5e5a4c27fac7633e66866fd367b0351ead8
        persist-credentials: false
        fetch-depth: 0
    - name: Apply exact frozen source and capture tracked identity
      id: candidate
      run: python -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/step-3.log"
    - name: Materialize actual docs preview helper
      run: python -c "import base64,os;from pathlib import Path;Path(os.environ['EVIDENCE'],'render.mjs').write_bytes(base64.b64decode(''))"
    - run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Render baseline reference then restore candidate
      run: node "$EVIDENCE/render.mjs" baseline
      id: baseline
      continue-on-error: true
      if: always() && steps.candidate.outcome == 'success'
    - name: Render candidate reference
      run: node "$EVIDENCE/render.mjs" candidate
      id: rendercandidate
      continue-on-error: true
      if: always() && steps.candidate.outcome == 'success'
    - name: Final exact tracked source guard
      if: always() && steps.candidate.outcome == 'success'
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs and native reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radio1276-docs-diagnostic
        path: /tmp/radio1276-docs-diagnostic
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    - name: Both strict rendering outcomes required
      if: always()
      env:
        BASELINE: ${{ steps.baseline.outcome }}
        CANDIDATE: ${{ steps.rendercandidate.outcome }}
      run: '[ "$BASELINE" = success ] && [ "$CANDIDATE" = success ]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVIDENCE: /tmp/radio1276-docs-diagnostic
      E2E_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
