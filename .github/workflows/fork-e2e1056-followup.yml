name: Fork e2e1056 followup qualification
on:
  push:
    branches: [validation/e2e1056-followup-20261016]
permissions:
  contents: read
concurrency:
  group: fork-e2e1056-followup
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'rudycelekli/e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eeb992dbfccc171ad0d9f787397a20abfd599a08
          fetch-depth: 3
          persist-credentials: false
      - name: Guard frozen source
        run: |
          test "$(git rev-parse HEAD)" = eeb992dbfccc171ad0d9f787397a20abfd599a08
          test "$(git rev-parse HEAD^{tree})" = 27a8196b4f0e23ce407db321419da3be1de23765
          test "$(git show -s --format=%P HEAD)" = "bd7c9dee908124ad5b9b4297bb448080aaba53f4"
          git diff --exit-code
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - name: Install exact lockfile and build native packages
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Native full core unit suite
        run: pnpm --filter e2e run test:unit
      - name: Required full repository checks
        run: pnpm check
      - name: Install deterministic local Chromium
        run: node packages/web/dist/bin.js install chromium --with-deps
      - name: Native serial and non-serial interruption integration
        run: pnpm --filter e2e exec vitest run tests/integration/interrupt-signals.test.ts
      - name: Built CLI deterministic testbed
        run: pnpm --filter @e2e-dev/testbed test
      - name: Built CLI deterministic web benchmark
        run: pnpm --filter @e2e-dev/web-benchmark test
      - name: Final frozen source guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = eeb992dbfccc171ad0d9f787397a20abfd599a08
          test "$(git rev-parse HEAD^{tree})" = 27a8196b4f0e23ce407db321419da3be1de23765
          git diff --exit-code
