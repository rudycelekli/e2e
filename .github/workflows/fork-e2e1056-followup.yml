name: Fork e2e1056 invariant-only harness correction
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  invariants:
    if: github.repository == 'rudycelekli/e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: /tmp/e2e1056-proof
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 6e9affe72cc15b1a5cd4bc563c60221e3112bead
        persist-credentials: false
    - name: Freeze same input and original module bytes
      run: python -c "import base64;exec(base64.b64decode(''))"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        check-latest: true
    - name: Apply exact already-rendered patch and preflight identity
      id: candidate
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Executable byte schema and actual Node26 invariants only
      run: node "$EVIDENCE/invariants-v3.mjs"
    - name: Final exact patch and source identity
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve invariant diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: e2e1056-invariants-only-proof
        path: /tmp/e2e1056-proof
        if-no-files-found: error
        retention-days: 14
