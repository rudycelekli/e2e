name: Fork e2e1056 focused docs repair qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'rudycelekli/e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: /tmp/e2e1056-proof
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tester-army/e2e
        ref: 6e9affe72cc15b1a5cd4bc563c60221e3112bead
        persist-credentials: false
    - name: Freeze input and readable proof scripts
      run: python -c "import base64;exec(base64.b64decode(''))"
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        check-latest: true
        cache: pnpm
    - name: Install exact repository lockfile
      run: pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install.log"
    - name: Install local Chromium for actual docs rendering
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps 2>&1 | tee "$EVIDENCE/browser-install.log"
    - name: Render unchanged baseline docs
      run: node "$EVIDENCE/render.mjs" baseline
    - name: Apply frozen four-file patch and preflight identity
      id: candidate
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Actual TypeScript AST and schema invariants plus native Node controls
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: node "$EVIDENCE/identity.mjs"
    - name: Full applicable pinned pnpm check
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: pnpm check 2>&1 | tee "$EVIDENCE/pnpm-check.log"
    - name: Render and capture corrected docs
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: node "$EVIDENCE/render.mjs" candidate
    - name: Final exact patch and source identity
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Preserve actual logs rendered pages and byte receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: e2e1056-doc-repair-proof
        path: /tmp/e2e1056-proof
        if-no-files-found: error
        retention-days: 14
